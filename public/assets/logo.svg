<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4f9c" />
      <stop offset="50%" stop-color="#083870" />
      <stop offset="100%" stop-color="#051c38" />
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="90%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Base Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#dropShadow)" />
  
  <!-- Outer Dotted Decorative Ring -->
  <circle cx="100" cy="100" r="89" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
  
  <!-- Inner Ring -->
  <circle cx="100" cy="100" r="72" fill="#072348" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Circular Text Path for Gyansthali International School -->
  <path id="textArcTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" />
  <text font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="800" fill="url(#goldGrad)" letter-spacing="1.2">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      GYANSTHALI INTL SCHOOL
    </textPath>
  </text>

  <!-- Bottom Ribbon / Banner -->
  <g transform="translate(0, 10)">
    <!-- Ribbon Shadow & Base -->
    <path d="M 40 148 L 160 148 L 148 168 L 100 164 L 52 168 Z" fill="#04162e" />
    <!-- Main Ribbon -->
    <path d="M 46 144 L 154 144 Q 160 144 158 150 L 150 162 L 100 157 L 50 162 L 42 150 Q 40 144 46 144 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8" />
    <text x="100" y="155" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="8.5" font-weight="900" fill="#071b32" letter-spacing="1">
      LEARN • GROW • LEAD
    </text>
  </g>

  <!-- Stars on Sides -->
  <polygon points="26,100 28,103 31,103 28,105 29,108 26,106 23,108 24,105 21,103 24,103" fill="url(#goldGrad)" />
  <polygon points="174,100 176,103 179,103 176,105 177,108 174,106 171,108 172,105 169,103 172,103" fill="url(#goldGrad)" />

  <!-- Center Emblem: Laurel Leaves (Wreath) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <!-- Left Wreath -->
    <path d="M 58 126 C 54 116 54 100 62 88 C 64 94 62 102 58 108 C 55 114 56 120 58 126 Z" />
    <path d="M 52 112 C 48 106 50 96 56 90 C 56 96 54 102 52 112 Z" />
    <path d="M 66 100 C 62 90 66 82 72 78 C 72 84 70 92 66 100 Z" />
    <!-- Right Wreath -->
    <path d="M 142 126 C 146 116 146 100 138 88 C 136 94 138 102 142 108 C 145 114 144 120 142 126 Z" />
    <path d="M 148 112 C 152 106 150 96 144 90 C 144 96 146 102 148 112 Z" />
    <path d="M 134 100 C 138 90 134 82 128 78 C 128 84 130 92 134 100 Z" />
  </g>

  <!-- Central Symbolism: Open Book & Torch of Wisdom -->
  <g transform="translate(0, -6)">
    <!-- Open Book -->
    <!-- Pages Spine & Backing -->
    <path d="M 100 128 L 74 119 C 68 117 68 126 74 128 L 100 136 L 126 128 C 132 126 132 117 126 119 Z" fill="#b45309" />
    <!-- Left Page -->
    <path d="M 100 133 C 86 126 75 127 68 121 C 67 114 68 106 72 107 C 80 110 90 112 100 119 Z" fill="url(#shieldGrad)" stroke="#0b4f9c" stroke-width="0.8" />
    <!-- Right Page -->
    <path d="M 100 133 C 114 126 125 127 132 121 C 133 114 132 106 128 107 C 120 110 110 112 100 119 Z" fill="url(#shieldGrad)" stroke="#0b4f9c" stroke-width="0.8" />
    <!-- Book Lines (Text on Pages) -->
    <path d="M 75 113 Q 84 116 93 121" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" fill="none" />
    <path d="M 76 118 Q 84 121 93 125" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" fill="none" />
    <path d="M 125 113 Q 116 116 107 121" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" fill="none" />
    <path d="M 124 118 Q 116 121 107 125" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" fill="none" />

    <!-- Torch Stem & Cup -->
    <path d="M 97 115 L 103 115 L 102 96 L 98 96 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.5" />
    <path d="M 94 96 C 94 92 106 92 106 96 L 104 100 L 96 100 Z" fill="url(#goldGrad)" />
    
    <!-- Torch Flame -->
    <path d="M 100 72 C 104 80 108 83 108 89 C 108 94 104 96 100 96 C 96 96 92 94 92 89 C 92 84 96 80 100 72 Z" fill="url(#flameGrad)" />
    <path d="M 100 80 C 102 83 104 86 104 89 C 104 91 102 93 100 93 C 98 93 96 91 96 89 C 96 87 98 84 100 80 Z" fill="#ffffff" opacity="0.9" />

    <!-- Graduation Cap / Monogram at Top -->
    <g transform="translate(0, 10)">
      <!-- Mortarboard Cap Diamond -->
      <polygon points="100,50 118,57 100,64 82,57" fill="#071b32" stroke="url(#goldGrad)" stroke-width="1.2" />
      <path d="M 89 61 L 89 67 C 89 71 111 71 111 67 L 111 61" fill="#0b4f9c" stroke="url(#goldGrad)" stroke-width="0.8" />
      <!-- Cap Button and Tassel -->
      <circle cx="100" cy="57" r="1.8" fill="url(#goldGrad)" />
      <path d="M 100 57 C 105 60 112 62 114 69" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" />
      <circle cx="114" cy="70" r="1.5" fill="url(#goldGrad)" />
    </g>
  </g>
</svg>
